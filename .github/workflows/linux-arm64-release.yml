name: Linux ARM64 Release

# Fork-only: builds edge as a Linux ARM64 AppImage and publishes it as a
# release whenever edge has a commit without one (e.g. after "Sync fork").
# Lives on its own branch so edge stays identical to upstream; schedule only
# fires from the default branch, so that branch must be the fork's default.
on:
  schedule:
    - cron: '17,47 * * * *'
  # Manual runs rebuild edge even if its release already exists.
  workflow_dispatch:

# Queue instead of cancel: a poll that lands mid-build must not kill it.
concurrency:
  group: linux-arm64-release
  cancel-in-progress: false

jobs:
  check:
    name: Check edge
    if: github.repository != 'has207/xenia-edge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Look for a release of edge's HEAD
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/${GH_REPO}/commits/edge" --jq .sha)
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] || ! gh release view "arm64-${sha::7}" > /dev/null 2>&1; then
            echo "edge at ${sha::7} needs a build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "arm64-${sha::7} already released"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    name: Build Linux ARM64
    needs: check
    if: needs.check.outputs.build == 'true'
    # Build on the oldest supported LTS so the AppImage's glibc floor (taken from
    # the build host) stays low enough for Ubuntu 22.04 / Debian 12 users.
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
      actions: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # A branch ref (not a SHA) so version.h reports "edge" instead of "detached".
      - uses: actions/checkout@v6
        with:
          ref: edge

      # edge may have moved since the check job; release what was actually built.
      - name: Record built commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache linuxdeploy tools
        id: cache-linuxdeploy
        uses: actions/cache@v5
        with:
          path: ~/linuxdeploy
          key: ${{ runner.os }}-${{ runner.arch }}-linuxdeploy-tools

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v5
        with:
          path: .slang
          # Keep in sync with SLANG_VERSION in xenia-build.py.
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        run: ./xenia-build.py slang

      - name: Setup
        run: |
          UBUNTU_BASE=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository --no-update "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-21 main"
          # jammy's libstdc++ (GCC 12) can't be compiled by Clang; see build.yml.
          sudo add-apt-repository -y --no-update ppa:ubuntu-toolchain-r/test

          printf '%s\n' \
            'Acquire::Languages "none";' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            | sudo tee /etc/apt/apt.conf.d/99ci > /dev/null

          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends \
            clang-21 lld-21 libclang-rt-21-dev llvm-21
          # make (snappy's nested configure) and liblz4-dev (linked directly)
          # come preinstalled on the x64 runner but not necessarily on ARM.
          sudo apt-get -y install g++-14 libgtk-3-dev libx11-xcb-dev ninja-build cmake libfontconfig1-dev libxtst-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libxfixes-dev \
            make liblz4-dev

          # Download linuxdeploy if not cached.
          if [ '${{ steps.cache-linuxdeploy.outputs.cache-hit }}' != 'true' ]; then
            mkdir -p ~/linuxdeploy
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage -O ~/linuxdeploy/linuxdeploy
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-aarch64.AppImage -O ~/linuxdeploy/linuxdeploy-plugin-appimage
            chmod +x ~/linuxdeploy/linuxdeploy ~/linuxdeploy/linuxdeploy-plugin-appimage
          fi
          echo "$HOME/linuxdeploy" >> $GITHUB_PATH

          # Update submodules
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $(grep -oP '(?<=path = )(?!third_party\/DirectXShaderCompiler).+' .gitmodules)

          # Fetch data repos (game-patches)
          ./xenia-build.py fetchdata
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Build
        env:
          CC: clang-21
          CXX: clang++-21
          SCCACHE_GHA_ENABLED: "true"
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: ./xenia-build.py build --config=Release
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Package AppImage
        env:
          # The ARM runner has no FUSE; linuxdeploy and its plugin unpack themselves instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          binary=build/bin/Linux/Release/xenia_edge
          if [ $(stat -c%s $binary) -le 100000 ]; then
            echo "::error::Binary is too small."
            exit 1
          fi
          chmod +x $binary

          mkdir -p artifacts/xenia_edge/usr/bin
          for size in 16 32 48 64 128 256 512 1024; do
            mkdir -p artifacts/xenia_edge/usr/share/icons/hicolor/${size}x${size}/apps
            cp assets/icon/$size.png artifacts/xenia_edge/usr/share/icons/hicolor/${size}x${size}/apps/xenia_edge.png
          done

          linuxdeploy --appdir artifacts/xenia_edge \
            --executable $binary \
            --desktop-file assets/xenia_edge.desktop \
            --icon-file assets/icon/256.png \
            --output appimage

          appimage_file=$(ls -1 *.AppImage | head -n1)
          if [ -z "$appimage_file" ]; then
            echo "::error::AppImage file not found after linuxdeploy"
            exit 1
          fi
          mv "$appimage_file" xenia_edge_linux_arm64.AppImage
          chmod +x xenia_edge_linux_arm64.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xenia_edge_linux_arm64
          path: xenia_edge_linux_arm64.AppImage
          if-no-files-found: error

  release:
    name: Create Release
    needs: build-release
    # The ARM runner image isn't guaranteed to ship gh; the x64 one does.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-release.outputs.sha }}
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: xenia_edge_linux_arm64

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          sha: ${{ needs.build-release.outputs.sha }}
        run: |
          tag=arm64-${sha::7}

          # Commit list since the previous release, like upstream's CI.yml.
          prev_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          prev_sha=""
          if [ -n "$prev_tag" ]; then
            prev_sha=$(git rev-parse "${prev_tag}^{}" 2>/dev/null || echo "")
          fi
          {
            echo "### Changes"
            echo ""
            if [ -n "$prev_sha" ] && [ "$prev_sha" != "$sha" ]; then
              git log --format="- %s (\`%h\`)" --abbrev=7 "${prev_sha}..${sha}" --
              echo ""
              echo "**Full changelog**: https://github.com/${GH_REPO}/compare/${prev_tag}...${tag}"
            else
              git log --format="- %s (\`%h\`)" --abbrev=7 -1 "${sha}" --
            fi
          } > release_notes.md

          # A re-run of the same commit replaces the asset instead of failing.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" xenia_edge_linux_arm64.AppImage --clobber
          else
            gh release create "$tag" xenia_edge_linux_arm64.AppImage \
              --target "$sha" -t "xenia_edge linux arm64 (${sha::7})" \
              --notes-file release_notes.md
          fi
